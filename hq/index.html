<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | MtaaniWeb HQ</title>
<link rel="icon" href="https://res.cloudinary.com/hztm3zo8/image/upload/w_64,h_64,c_fill,q_auto,f_auto/v1782489344/20260611_134430_jn0ezd.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{ var t = localStorage.getItem('mtani-theme'); document.documentElement.setAttribute('data-theme', t || 'light'); }catch(e){}
</script>
<link rel="stylesheet" href="/assets/hq.css">

</head>
<body>
<div id="content" hidden>
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .lg-card{width:100%;max-width:400px;padding:36px 32px;}
  .lg-brand{text-align:center;margin-bottom:28px;}
  .lg-brand .logo-img,.lg-brand .logo-m{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:block;}
  .lg-brand .logo-m{display:none;line-height:56px;text-align:center;font-size:1.6rem;}
  .lg-brand.logo-fail .logo-img{display:none;}
  .lg-brand.logo-fail .logo-m{display:block;}
  .lg-brand .mark{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-0.04em;}
  .lg-brand .sub{font-size:0.74rem;color:var(--muted);margin-top:6px;letter-spacing:0.12em;}
  .row-between{margin-bottom:22px;font-size:0.8rem;}
  .remember{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:0.82rem;cursor:pointer;}
  .linkbtn{background:none;border:none;color:var(--cyan);font-size:0.82rem;cursor:pointer;padding:0;}
  .msg{display:none;font-size:0.82rem;padding:11px 13px;border-radius:11px;margin-bottom:18px;}
  .msg.show{display:block;}
  .msg.err{background:var(--err-bg);border:1px solid rgba(228,87,107,0.35);color:var(--err);}
  .msg.ok{background:var(--ok-bg);border:1px solid rgba(61,213,152,0.35);color:var(--ok);}
  .lg-foot{text-align:center;margin-top:22px;font-size:0.78rem;color:var(--muted);}
  .lg-foot a{color:var(--cyan);}
  .back-link{position:fixed;top:22px;left:22px;font-size:0.84rem;color:var(--muted);}
  .back-link:hover{color:var(--ink);}
  .btn.full{width:100%;min-height:48px;}
</style>
<a href="https://mtaaniweb.co.ke/" class="back-link">&larr; MtaaniWeb</a>
<div class="lg-card card">
  <div class="lg-brand" id="lgBrand">
    <img class="logo-img" id="lgLogo" alt="MtaaniWeb">
    <span class="logo-m">M</span>
    <div class="mark">MtaaniWeb</div>
    <div class="sub mono">MANAGEMENT SYSTEM</div>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@mtaaniweb.co.ke" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
    </div>
    <div class="row-between">
      <label class="remember"><input type="checkbox" id="remember" checked> Stay signed in</label>
      <button type="button" class="linkbtn" id="forgot">Forgot password?</button>
    </div>
    <button type="submit" class="btn primary full" id="go">Sign in</button>
  </form>
  <div class="lg-foot">Access is restricted to MtaaniWeb admins.<br>Need access? <a href="https://wa.me/254715392010?text=Hello%20MtaaniWeb%2C%20I%20need%20access%20to%20the%20management%20system." target="_blank" rel="noopener">Contact the team</a></div>
</div>

</div>
<script type="module">
import { auth, LOGO_URL } from '/assets/mtaani-config.js';
import { logoUrl } from '/assets/mtaani-utils.js';
import { onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const $ = s => document.querySelector(s);
document.getElementById('content').hidden = false;

/* Logo, with an M when it cannot load */
const logo = $('#lgLogo'), brand = $('#lgBrand');
logo.src = logoUrl(160);
const fail = () => brand.classList.add('logo-fail');
logo.addEventListener('error', fail);
window.addEventListener('offline', fail);

function show(text, kind) {
  const m = $('#msg');
  m.textContent = text; m.className = 'msg show ' + kind;
}
function hide() { $('#msg').className = 'msg'; }

if (new URLSearchParams(location.search).get('denied')) show('This account does not have access to the management system.', 'err');

/* Already signed in? Go straight to the dashboard. */
onAuthStateChanged(auth, u => { if (u && !new URLSearchParams(location.search).get('denied')) location.replace('/hq/dashboard/'); });

const errorText = code => ({
  'auth/invalid-credential': 'Incorrect email or password.',
  'auth/wrong-password': 'Incorrect email or password.',
  'auth/user-not-found': 'Incorrect email or password.',
  'auth/invalid-email': 'Enter a valid email address.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed': 'No connection. Check your internet and try again.',
  'auth/user-disabled': 'This account has been disabled.'
}[code] || 'Something went wrong. Please try again.');

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); hide();
  const email = $('#email').value.trim(), pw = $('#password').value;
  if (!email || !pw) { show('Enter your email and password.', 'err'); return; }
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await setPersistence(auth, $('#remember').checked ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pw);
    location.replace('/hq/dashboard/');
  } catch (err) {
    show(errorText(err.code), 'err');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});

$('#forgot').addEventListener('click', async () => {
  hide();
  const email = $('#email').value.trim();
  if (!email) { show('Enter your email above first, then tap Forgot password.', 'err'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    show('If an account exists for that email, a password reset link is on its way. Check your inbox.', 'ok');
  } catch (err) {
    if (err.code === 'auth/invalid-email') show('Enter a valid email address.', 'err');
    else show('If an account exists for that email, a password reset link is on its way. Check your inbox.', 'ok');
  }
});

</script>
</body>
</html>
