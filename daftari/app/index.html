<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftari Workspace</title><link rel="stylesheet" href="../assets/styles.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script><script src="../assets/config.js"></script><script src="../assets/catalogue.js"></script></head><body><div id="root"></div><div id="toast" class="toast hidden"></div>

const ICONS={"dashboard": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>", "create": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M12 7v10M7 12h10\"/>", "templates": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><path d=\"M3 9h18M9 21V9\"/>", "projects": "<path d=\"M3 7h7l2 2h9v11H3z\"/><path d=\"M3 7V5h7l2 2\"/>", "brand": "<path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"/><path d=\"M8 12l2.5 2.5L16 9\"/>", "media": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"1.5\"/><path d=\"M21 16l-5-5-8 8\"/>", "campaigns": "<path d=\"M4 14V8l15-4v14L4 14z\"/><path d=\"M4 14l2 6h5l-2-5\"/>", "calendar": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 10h18\"/>", "exports": "<path d=\"M12 3v12M7 10l5 5 5-5\"/><path d=\"M4 19h16\"/>", "admin": "<path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"/><path d=\"M9 12h6M12 9v6\"/>", "settings": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z\"/>", "users": "<path d=\"M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20\"/><circle cx=\"9.5\" cy=\"7\" r=\"4\"/><path d=\"M20 20v-1.5a4 4 0 0 0-3-3.9M16 3.2a4 4 0 0 1 0 7.6\"/>", "credits": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 10h18M7 15h4\"/>", "search": "<circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"M16 16l5 5\"/>", "image": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"M21 15l-5-5L5 21\"/>", "spark": "<path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l1 2.5 2.5 1-2.5 1L19 23l-1-2.5-2.5-1 2.5-1z\"/>", "logout": "<path d=\"M10 17l5-5-5-5M15 12H3\"/><path d=\"M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7\"/>"};function ico(n){return `<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.spark}</svg></span>`;}
const cfg=DAFTARI_CONFIG,cat=DAFTARI_CATALOGUE;firebase.initializeApp(cfg.firebase);const auth=firebase.auth(),db=firebase.firestore();let user=null,profile={},admin=false,route='dashboard',activeCat=Object.keys(cat.primaryCategories)[0],editor=null,activeDesignId=null,uploadBusy=false;
const root=document.getElementById('root');function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(v){try{return v?.toDate?v.toDate().toLocaleDateString():''}catch{return ''}}function go(r){route=r;render()}function shortName(){return (profile.displayName||user?.displayName||user?.email||'Member').split(' ')[0]}function adminCheck(){return db.collection('admins').doc(user.uid).get().then(s=>s.exists&&s.data().active!==false)}
const navGroups=[['WORKSPACE',[['dashboard','Overview','dashboard'],['create','Create design','create'],['templates','Templates','templates'],['projects','My projects','projects'],['brand','Brand kit','brand'],['media','Media library','media']]],['PUBLISHING',[['campaigns','Campaigns','campaigns'],['calendar','Seasonal calendar','calendar'],['exports','Exports','exports']]],['ACCOUNT',[['credits','Credits & plans','credits'],['settings','Settings','settings']]]];
function shell(){root.innerHTML=`<div class="app-shell"><aside class="sidebar"><a class="brand" href="../"><img src="${cfg.brand.logo}" alt="Daftari"><span>Daftari<small style="color:#b9b7ce">BY MTAANIWEB</small></span></a>${navGroups.map(g=>`<div class="nav-label">${g[0]}</div>${g[1].map(n=>`<a href="#" class="side-link" data-route="${n[0]}">${ico(n[2])}${n[1]}</a>`).join('')}`).join('')}${admin?`<div class="nav-label">ADMINISTRATION</div><a href="#" class="side-link" data-route="admin">${ico('admin')}Admin control</a>`:''}<div class="side-bottom"><div style="padding:8px 10px;color:#c9c8d8;font-size:11px">${esc(user.email)}<br><span style="color:#9290aa">${Number(profile.credits||0)} credits</span></div><a href="#" class="side-link" id="signout">${ico('logout')}Sign out</a></div></aside><div class="app-main"><header class="app-top"><div style="display:flex;align-items:center;gap:12px"><button class="btn small mobile-nav-btn" id="menuBtn">☰</button><h1 id="pageTitle">Overview</h1></div><div class="user-mini"><span class="muted" style="font-size:11px">${Number(profile.credits||0)} credits</span><div class="avatar">${esc(shortName().slice(0,1).toUpperCase())}</div></div></header><main class="app-content" id="content"></main></div></div><nav class="mobile-bottom">${[['dashboard','Home','dashboard'],['create','Create','create'],['templates','Templates','templates'],['projects','Projects','projects'],['credits','Credits','credits']].map(n=>`<button data-route="${n[0]}" class="${route===n[0]?'active':''}">${ico(n[2])}${n[1]}</button>`).join('')}</nav>`;root.querySelectorAll('[data-route]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.route)}));document.getElementById('signout').onclick=e=>{e.preventDefault();auth.signOut()};document.getElementById('menuBtn')?.addEventListener('click',()=>{const s=root.querySelector('.sidebar');s.style.display=s.style.display==='flex'?'none':'flex';s.style.position='fixed';s.style.zIndex='50';s.style.width='260px'})}
function head(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="toolbar">${actions}</div></div>`}
function docCol(name){return db.collection('users').doc(user.uid).collection(name)}async function loadProfile(){const ref=db.collection('users').doc(user.uid),snap=await ref.get();if(!snap.exists){profile={uid:user.uid,email:user.email,displayName:user.displayName||'',status:'active',credits:0,plan:'free',createdAt:firebase.firestore.FieldValue.serverTimestamp()};await ref.set(profile)}else profile=snap.data();if(['frozen','suspended','removed'].includes(profile.status)){await auth.signOut();throw new Error('This account is temporarily restricted. Contact the Daftari administrator.')}if(profileUnsub)profileUnsub();profileUnsub=ref.onSnapshot(s=>{if(!s.exists)return;const live=s.data();if(['frozen','suspended','removed'].includes(live.status))auth.signOut()});admin=await adminCheck()}
function stat(label,val,ic){return `<div class="stat"><span>${label}</span><b>${val}</b></div>`}
async function render(){if(!user)return; shell();const c=document.getElementById('content');const titles={dashboard:'Overview',create:'Create design',templates:'Template library',projects:'My projects',brand:'Brand kit',media:'Media library',campaigns:'Campaigns',calendar:'Seasonal calendar',exports:'Exports',credits:'Credits & plans',settings:'Settings',admin:'Admin control'};document.getElementById('pageTitle').textContent=titles[route]||'Daftari';root.querySelectorAll('.side-link').forEach(a=>a.classList.toggle('active',a.dataset.route===route));root.querySelectorAll('.mobile-bottom button').forEach(a=>a.classList.toggle('active',a.dataset.route===route));try{if(route==='dashboard')await dashboard(c);else if(route==='templates')templates(c);else if(route==='create')await create(c);else if(route==='projects')await projects(c);else if(route==='brand')await brand(c);else if(route==='media')await media(c);else if(route==='campaigns')await campaigns(c);else if(route==='calendar')calendar(c);else if(route==='exports')await exportsPage(c);else if(route==='credits')credits(c);else if(route==='settings')settings(c);else if(route==='admin')await adminPage(c)}catch(e){c.innerHTML=`<div class="panel"><h3>Unable to load this section</h3><p>${esc(e.message)}</p></div>`}}
async function dashboard(c){const [ds,ps,cs]=await Promise.all([docCol('designs').orderBy('updatedAt','desc').limit(6).get(),docCol('projects').get(),docCol('campaigns').get()]);const designs=ds.docs.map(d=>({id:d.id,...d.data()}));c.innerHTML=head(`Good to see you, ${esc(shortName())}.`,`Your creative workspace is ready.`, `<button class="btn primary" id="newDesign">${ico('create')} Create a design</button>`)+`<div class="stat-grid">${stat('Saved designs',ds.size)}${stat('Projects',ps.size)}${stat('Campaigns',cs.size)}${stat('Available credits',profile.credits||0)}</div><div class="two-col"><section class="panel"><h3>Recently worked on</h3><div id="recent">${designs.length?designs.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><div><b style="font-size:12px">${esc(d.name||'Untitled design')}</b><div class="muted" style="font-size:10px">${esc(d.templateName||'Design')} · ${fmtDate(d.updatedAt)}</div></div><button class="btn small" data-edit="${d.id}">Open</button></div>`).join(''):'<div class="empty">Your saved designs will appear here.</div>'}</div></section><section class="panel"><h3>Continue with a template</h3><p>Choose a communication purpose and start with a considered layout.</p><div class="field"><label>Template category</label><select id="quickCat">${Object.keys(cat.primaryCategories).map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn primary" id="quickStart">Browse templates</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Workspace snapshot</h3><p>Keep your brand assets, projects and campaigns organised in one place.</p><button class="btn" data-jump="brand">Open Brand Kit</button></section></div>`;document.getElementById('newDesign').onclick=()=>go('create');document.getElementById('quickStart').onclick=()=>{activeCat=document.getElementById('quickCat').value;go('templates')};c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{activeDesignId=b.dataset.edit;go('create')});c.querySelector('[data-jump]').onclick=()=>go('brand')}
function templates(c){c.innerHTML=head('Template library','Browse all 60 catalogue templates, organised by communication purpose.')+`<div class="template-browser"><aside class="template-categories">${Object.keys(cat.primaryCategories).map((k,i)=>`<button class="category-btn ${activeCat===k?'active':''}" data-cat="${esc(k)}">${esc(k)} <span class="muted">${cat.primaryCategories[k].length}</span></button>`).join('')}<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><div class="eyebrow">DESIGN RESOURCES</div><p class="muted" style="font-size:11px">${cat.styles.length} styles · ${cat.fonts.length} fonts · ${cat.fontPairings.length} pairings · ${cat.formats.length} formats</p></div></aside><section><div class="toolbar" style="margin-bottom:13px"><input class="control" id="templateSearch" placeholder="Search templates" style="max-width:340px"><select id="styleFilter" class="control" style="max-width:210px"><option value="">All design styles</option>${cat.styles.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="template-list" id="templateList"></div></section></div>`;function paint(){const term=(c.querySelector('#templateSearch').value||'').toLowerCase(),host=c.querySelector('#templateList');host.innerHTML='';cat.primaryCategories[activeCat].filter(t=>t.toLowerCase().includes(term)).forEach((t,i)=>{const el=document.createElement('article');el.className='catalog-card';el.innerHTML=`<div class="catalog-art"><small>${esc(activeCat)} / ${String(i+1).padStart(2,'0')}</small><b>${esc(t)}</b><small>DAFTARI / VISUAL EDITION</small></div><div class="catalog-meta"><strong>${esc(t)}</strong><p>Editable template · ${esc(c.querySelector('#styleFilter').value||'Multiple styles')}</p><button class="btn primary small" data-use="${esc(t)}">Use template</button></div>`;el.querySelector('button').onclick=()=>{editor=defaultDesign(t,activeCat);activeDesignId=null;go('create')};host.appendChild(el)});if(!host.children.length)host.innerHTML='<div class="empty">No matching templates.</div>'}c.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;templates(c)});c.querySelector('#templateSearch').oninput=paint;c.querySelector('#styleFilter').onchange=paint;paint()}
function defaultDesign(title='Official Event Announcement',category='Before an Event'){return {name:title,title:title,description:'Add a concise description that gives people the information they need.',label:category.toUpperCase(),location:'Nairobi, Kenya',date:'',image:'',imageX:50,imageY:50,imageScale:100,background:'#0D0B2B',accent:'#38B6FF',textColor:'#FFFFFF',backgroundMode:'solid',background2:'#9B59B6',gradientAngle:145,layout:'top',overlayStrength:82,textAlign:'left',titleSize:38,borderWidth:0,borderColor:'#38B6FF',shadowStrength:30,spacing:8,shapeStyle:'none',shapeColor:'#9B59B6',imageMask:'none',logoUrl:'',font:'Playfair Display',bodyFont:'Inter',format:'Portrait Social',style:'Modern Editorial',category,templateName:title,createdAt:null}}
async function create(c){let d=editor||defaultDesign();const projectSnap=await docCol('projects').get(),projectOptions=projectSnap.docs.map(x=>({id:x.id,...x.data()}));if(activeDesignId){const snap=await docCol('designs').doc(activeDesignId).get();if(snap.exists)d={...defaultDesign(),...snap.data()};else activeDesignId=null}editor=d;c.innerHTML=head('Create design','Select a template, shape the composition and save your work.',`<button class="btn" id="saveDesign">Save design</button><button class="btn primary" id="exportDesign">Export PNG</button>`)+`<div class="two-col" style="max-width:760px"><div class="field"><label>Template category</label><select id="templateCategory">${Object.keys(cat.primaryCategories).map(k=>`<option>${esc(k)}</option>`).join('')}</select></div><div class="field"><label>Template</label><select id="templateSelect"><option value="">Choose a template…</option></select></div></div><div class="editor-layout"><div class="editor-stage"><div class="poster" id="poster"><div class="poster-bg" id="posterBg"></div><div class="poster-image-wrap" id="imageWrap"><img class="poster-image hidden" id="posterImage" draggable="false"></div><div class="poster-shape" id="posterShape"></div><img class="poster-logo hidden" id="posterLogo" alt="Brand logo"><div class="poster-overlay"></div><div class="poster-brand">DAFTARI BY MTAANIWEB</div><div class="poster-copy"><div class="poster-kicker" id="posterLabel"></div><h2 class="poster-title" id="posterTitle"></h2><p class="poster-desc" id="posterDesc"></p><div class="poster-meta" id="posterMeta"></div></div></div></div><aside class="panel"><div class="editor-tabs"><button class="active" data-tab="content">Content</button><button data-tab="image">Image</button><button data-tab="design">Design</button><button data-tab="brand">Brand</button></div><div id="editorPanel"></div></aside></div>`;
const poster=c.querySelector('#poster'),img=c.querySelector('#posterImage'),panel=c.querySelector('#editorPanel');let tab='content';function update(){poster.style.aspectRatio=cat.formats.find(f=>f[0]===d.format)?.[2]+'/'+cat.formats.find(f=>f[0]===d.format)?.[3]||'4/5';poster.dataset.layout=d.layout||'top';const bgPaint=d.backgroundMode==='gradient'?`linear-gradient(${d.gradientAngle||145}deg,${d.background},${d.background2||'#9B59B6'})`:d.background;poster.style.background=bgPaint;poster.querySelector('.poster-bg').style.background=bgPaint;poster.style.color=d.textColor;poster.style.border=`${d.borderWidth||0}px solid ${d.borderColor||'#38B6FF'}`;poster.style.boxShadow=`0 14px ${18+(d.shadowStrength||0)}px rgba(0,0,0,${(d.shadowStrength||0)/100})`;poster.querySelector('.poster-copy').style.padding=(d.spacing||8)+'%';const shape=poster.querySelector('#posterShape');shape.style.background=d.shapeColor||'#9B59B6';shape.style.display=d.shapeStyle==='none'?'none':'block';shape.style.borderRadius=d.shapeStyle==='circle'?'50%':d.shapeStyle==='rounded'?'28px':'0';shape.style.width=d.shapeStyle==='line'?'38%':'44%';shape.style.height=d.shapeStyle==='line'?'5px':d.shapeStyle==='circle'?'35%':'20%';shape.style.top='24%';shape.style.right='8%';const logoEl=poster.querySelector('#posterLogo');if(d.logoUrl){logoEl.src=d.logoUrl;logoEl.classList.remove('hidden')}else logoEl.classList.add('hidden');poster.querySelector('.poster-image-wrap').style.borderRadius=d.imageMask==='circle'?'50%':d.imageMask==='rounded'?'24px':d.imageMask==='arch'?'50% 50% 0 0':'0';poster.querySelector('.poster-title').style.fontFamily=`'${d.font}',serif`;poster.querySelector('.poster-desc').style.fontFamily=`'${d.bodyFont}',sans-serif`;poster.querySelector('.poster-title').style.color=d.textColor;poster.querySelector('.poster-title').style.fontSize=(d.titleSize||38)+'px';poster.querySelector('.poster-copy').style.textAlign=d.textAlign||'left';poster.querySelector('.poster-kicker').style.color=d.accent;pos function credits(c){c.innerHTML=head('Credits and plans','Manage your available creative credits. Your account is not automatically signed out when credits reach zero.')+`<div class="stat-grid">${stat('Current balance',profile.credits||0)}${stat('Account plan',esc(profile.plan||'Free'))}${stat('Account status',esc(profile.status||'active'))}${stat('Billing model','Credits')}</div><div class="two-col"><div class="panel"><h3>Top up credits</h3><p>Credit packs and plan options are administered by Daftari. Contact the team for current rates and payment instructions.</p><div id="packages">Loading available packages…</div><a class="btn primary" href="https://wa.me/254715392010?text=Hello%20Daftari%2C%20I%20would%20like%20to%20top%20up%20credits." target="_blank" rel="noopener">Request a top-up</a></div><div class="panel"><h3>How access works</h3><p>Credits are used according to the rates configured by the administrator. If your balance reaches zero, your account remains signed in unless an administrator manually freezes or restricts it.</p><p>Weekly and monthly access packages may be configured by the administrator. Sign-up remains free.</p><div class="pill good">No automatic logout on zero credits</div></div></div>`;db.collection('settings').doc('packages').get().then(s=>{const p=s.exists?s.data().items||[]:[];c.querySelector('#packages').innerHTML=p.length?p.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b><div class="muted" style="font-size:11px">${esc(x.description||'')} · ${esc(x.price||'Contact us')}</div></div>`).join(''):'<p class="muted">Packages are being configured. Contact the team for current options.</p>'})}
function settings(c){c.innerHTML=head('Settings','Manage your profile and account preferences.')+`<div class="panel" style="max-width:650px"><div class="field"><label>Display name</label><input id="displayName" value="${esc(profile.displayName||user.displayName||'')}"></div><div class="field"><label>Email address</label><input value="${esc(user.email)}" disabled></div><button class="btn primary" id="saveProfile">Save profile</button><div style="margin-top:25px;border-top:1px solid var(--line);padding-top:18px"><h3>Account security</h3><button class="btn" id="resetPass">Send password reset email</button></div></div>`;c.querySelector('#saveProfile').onclick=async()=>{const n=c.querySelector('#displayName').value.trim();await db.collection('users').doc(user.uid).update({displayName:n});profile.displayName=n;toast('Profile updated');render()};c.querySelector('#resetPass').onclick=async()=>{await auth.sendPasswordResetEmail(user.email);toast('Password reset email sent')}}
async function adminPage(c){if(!admin){c.innerHTML='<div class="panel"><h3>Administrator access required</h3><p>This area is available only to authorised Daftari administrators.</p></div>';return}const snap=await db.collection('users').get(),users=snap.docs.map(x=>({id:x.id,...x.data()}));c.innerHTML=head('Admin control','Manage accounts, access, credit balances and packages.')+`<div class="stat-grid">${stat('Accounts',users.length)}${stat('Active',users.filter(x=>!['frozen','suspended','removed'].includes(x.status)).length)}${stat('Frozen',users.filter(x=>x.status==='frozen'||x.status==='suspended').length)}${stat('Total credits',users.reduce((a,x)=>a+Number(x.credits||0),0))}</div><div class="panel"><div class="page-head"><div><h3>Accounts and access</h3><p>Credit depletion does not automatically sign users out. Access changes are administrator-controlled.</p></div><button class="btn" id="refreshUsers">Refresh</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Account</th><th>Status</th><th>Credits</th><th>Plan</th><th>Actions</th></tr></thead><tbody>${users.map(x=>`<tr><td>${esc(x.displayName||x.email||x.id)}<br><span class="muted">${esc(x.email||'')}</span></td><td><span class="pill ${x.status==='frozen'||x.status==='suspended'?'bad':'good'}">${esc(x.status||'active')}</span></td><td>${Number(x.credits||0)}</td><td>${esc(x.plan||'free')}</td><td><button class="btn small" data-credit="${x.id}">Add / deduct</button> <button class="btn small" data-freeze="${x.id}">${x.status==='frozen'?'Restore':'Freeze'}</button> <button class="btn small" data-remove="${x.id}">Remove</button></td></tr>`).join('')}</tbody></table></div></div><div class="two-col" style="margin-top:16px"><div class="panel"><h3>Credit packages and access periods</h3><p>Set top-up packs and weekly or monthly access options.</p><textarea id="packageJson" style="width:100%;min-height:150px;font:11px monospace">${esc(JSON.stringify((await db.collection('settings').doc('packages').get()).data()?.items||[{name:'Starter credits',credits:100,price:'KES —',description:'One-time top-up'},{name:'Weekly access',credits:250,price:'KES —',description:'7-day access package'},{name:'Monthly access',credits:900,price:'KES —',description:'30-day access package'}],null,2))}</textarea><button class="btn primary" id="savePackages">Save packages</button></div><div class="panel"><h3>Administrator notes</h3><p>Account removal is a soft removal for safety. The user record is marked removed and access is blocked. It does not delete authentication credentials or historical design data.</p><p>For a full deletion request, remove the Firebase Authentication user through the Firebase console or a trusted server-side Admin SDK workflow.</p><p><b>Admin security:</b> access is determined by the protected <code>admins/{uid}</code> document.</p></div></div>`;
const activityRows=[];for(const account of users){const tx=await db.collection('users').doc(account.id).collection('transactions').orderBy('createdAt','desc').limit(5).get();tx.docs.forEach(t=>activityRows.push({email:account.email||account.id,...t.data()}))}activityRows.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));const activity=document.createElement('div');activity.className='panel';activity.style.marginTop='16px';activity.innerHTML='<h3>Recent credit activity</h3>'+ (activityRows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Account</th><th>Action</th><th>Amount</th><th>New balance</th></tr></thead><tbody>${activityRows.slice(0,20).map(t=>`<tr><td>${esc(t.email)}</td><td>${esc(t.type||'adjustment')}</td><td>${Number(t.amount||0)}</td><td>${Number(t.balanceAfter||0)}</td></tr>`).join('')}</tbody></table></div>`:'<p>No credit activity recorded yet.</p>');c.appendChild(activity);c.querySelectorAll('[data-credit]').forEach(b=>b.onclick=async()=>{const row=users.find(x=>x.id===b.dataset.credit);const delta=prompt('Enter credits to add (positive) or deduct (negative). Current balance: '+Number(row.credits||0));if(delta===null||!Number.isFinite(Number(delta)))return;const next=Math.max(0,Number(row.credits||0)+Number(delta));await db.collection('users').doc(b.dataset.credit).update({credits:next,creditsUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('users').doc(b.dataset.credit).collection('transactions').add({type:Number(delta)>=0?'credit_added':'credit_deducted',amount:Math.abs(Number(delta)),balanceBefore:Number(row.credits||0),balanceAfter:next,adminUid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Credit balance updated');adminPage(c)});c.querySelectorAll('[data-freeze]').forEach(b=>b.onclick=async()=>{const row=users.find(x=>x.id===b.dataset.freeze),freeze=row.status!=='frozen';await db.collection('users').doc(row.id).update({status:freeze?'frozen':'active',statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast(freeze?'Account frozen':'Account restored');adminPage(c)});c.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Mark this account as removed and block access?'))return;await db.collection('users').doc(b.dataset.remove).update({status:'removed',removedAt:firebase.firestore.FieldValue.serverTimestamp()});adminPage(c)});c.querySelector('#refreshUsers').onclick=()=>adminPage(c);c.querySelector('#savePackages').onclick=async()=>{try{const items=JSON.parse(c.querySelector('#packageJson').value);await db.collection('settings').doc('packages').set({items,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Packages saved')}catch(e){toast('Invalid package JSON')}}}
function rangeInput(label,id,val){return `<div class="field"><label>${label}: ${val}</label><input type="range" id="${id}" min="0" max="100" value="${val}"></div>`}
let authUnsub=auth.onAuthStateChanged(async u=>{user=u;if(!u){location.href='../login/';return}try{await loadProfile();await render()}catch(e){toast(e.message);if(auth.currentUser)await auth.signOut()}});
</script></body></html>
