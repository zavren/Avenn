function showWorkspaceError(error){
  const message=error&&error.message?error.message:String(error||'Unknown error');
  root.innerHTML=`<main style="max-width:680px;margin:10vh auto;padding:24px"><section class="panel"><h2>We couldn't open your workspace</h2><p>You're still signed in. Daftari encountered this error while loading your account:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f3f8;padding:14px;border-radius:8px">${esc(message)}</pre><p>Check the Firestore rules and account profile, then try again.</p><button class="btn primary" id="retryWorkspace">Try again</button> <button class="btn" id="exitWorkspace">Sign out</button></section></main>`;
  document.getElementById('retryWorkspace').onclick=async()=>{try{await loadProfile();await render()}catch(e){showWorkspaceError(e)}};
  document.getElementById('exitWorkspace').onclick=()=>auth.signOut();
}

  host.querySelectorAll('[data-account-freeze]').forEach(b=>b.onclick=async()=>{const row=users.find(x=>x.id===b.dataset.accountFreeze),freeze=row.status!=='frozen';if(!confirm((freeze?'Freeze':'Restore')+' '+(row.email||row.displayName||'this account')+'?'))return;try{await db.collection('users').doc(row.id).update({status:freeze?'frozen':'active',statusUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast(freeze?'Account frozen':'Account restored');adminPage(c)}catch(e){toast('Could not update account: '+e.message)}});

async function campaigns(c){
 const snap=await docCol('campaigns').orderBy('createdAt','desc').get(),items=snap.docs.map(x=>({id:x.id,...x.data()}));
 c.innerHTML=head('Campaigns','Keep every design connected to one event identity.',`<button class="btn primary" id="showCampaignForm">Create campaign</button>`)+`<div id="campaignFormHost"></div><div class="campaign-list">${items.map(x=>`<article class="panel campaign-card"><div class="eyebrow">EVENT CAMPAIGN</div><h3>${esc(x.name)}</h3><p>${esc(x.description||'Event communication collection')}</p><div class="campaign-facts"><span>${esc(x.date||'Date to be confirmed')}</span><span>${esc(x.venue||x.location||'Venue to be confirmed')}</span></div><div class="toolbar"><button class="btn primary small" data-series="${x.id}">Create 6-piece series</button><button class="btn small" data-campaign-designs="${x.id}">View designs</button><button class="btn small danger" data-delete-campaign="${x.id}">Delete</button></div></article>`).join('')||'<div class="empty">No campaigns yet. Create your first event campaign and Daftari can prepare a coordinated set of designs.</div>'}</div>`;
 function showForm(){const host=c.querySelector('#campaignFormHost');host.innerHTML=`<form class="panel campaign-form" id="campaignCreateForm"><h3>New event campaign</h3><div class="two-col"><div class="field"><label>Event or campaign name</label><input name="name" required placeholder="e.g. Nairobi Creative Summit"></div><div class="field"><label>Event date</label><input name="date" placeholder="e.g. 18 March 2027"></div><div class="field"><label>Venue</label><input name="venue" placeholder="Venue name"></div><div class="field"><label>Location</label><input name="location" placeholder="Nairobi, Kenya"></div><div class="field"><label>Ticket information</label><input name="ticket" placeholder="Tickets from KES 1,500"></div><div class="field"><label>Brand / organiser name</label><input name="brandName" placeholder="Organisation name"></div></div><div class="field"><label>Campaign description</label><textarea name="description" placeholder="What is this event about?"></textarea></div><div class="toolbar"><button class="btn primary" type="submit">Save campaign</button><button class="btn" type="button" id="cancelCampaign">Cancel</button></div></form>`;host.querySelector('#cancelCampaign').onclick=()=>host.innerHTML='';host.querySelector('#campaignCreateForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),data=Object.fromEntries(fd.entries());data.createdAt=firebase.firestore.FieldValue.serverTimestamp();data.designCount=0;await docCol('campaigns').add(data);toast('Campaign created');campaigns(c)}}
 c.querySelector('#showCampaignForm').onclick=showForm;
 c.querySelectorAll('[data-series]').forEach(b=>b.onclick=async()=>{const campaign=items.find(x=>x.id===b.dataset.series);if(!campaign)return;const names=['Save the Date','Headliner Reveal','Event Programme','Early Bird Tickets','Event Highlights','Thank You Message'];const existing=await docCol('designs').where('campaignId','==',campaign.id).get();if(existing.size){if(!confirm('This campaign already has designs. Create another six-piece series?'))return}const batch=db.batch();names.forEach((name,i)=>{const d=defaultDesign(name);d.name=campaign.name+' · '+name;d.title=[`Save the date`,`Meet the ${campaign.name} lineup`,`The programme`,`Tickets are available`,`The moments from ${campaign.name}`,`Thank you for being part of it`][i];d.description=campaign.description||d.description;d.venue=campaign.venue||d.venue;d.location=campaign.location||d.location;d.date=campaign.date||d.date;d.ticket=campaign.ticket||d.ticket;d.brandName=campaign.brandName||campaign.name;d.campaignId=campaign.id;d.campaignName=campaign.name;d.createdAt=firebase.firestore.FieldValue.serverTimestamp();d.updatedAt=firebase.firestore.FieldValue.serverTimestamp();batch.set(docCol('designs').doc(),d)});await batch.commit();await docCol('campaigns').doc(campaign.id).update({designCount:existing.size+6,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Six campaign designs created');campaigns(c)});
 c.querySelectorAll('[data-campaign-designs]').forEach(b=>b.onclick=()=>{campaignFilter=b.dataset.campaignDesigns;go('projects')});c.querySelectorAll('[data-delete-campaign]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this campaign? Its saved designs will remain in My Projects.')){await docCol('campaigns').doc(b.dataset.deleteCampaign).delete();campaigns(c)}});
}
async function projects(c){
 const snap=await docCol('designs').orderBy('updatedAt','desc').get(),all=snap.docs.map(x=>({id:x.id,...x.data()})),rows=campaignFilter?all.filter(x=>x.campaignId===campaignFilter):all;
 let campaignName='';if(campaignFilter){const cp=await docCol('campaigns').doc(campaignFilter).get();campaignName=cp.data()?.name||'Campaign'}
