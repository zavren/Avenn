<style>
:root{--bg:#F4F5FA;--card:#fff;--ink:#17163A;--mut:#6B6A85;--line:#E4E6EF;--stage:#E8EAF3;--on-bg:#0D0B2B;--on-fg:#fff;--side:#0D0B2B;--r:12px;--sh:0 1px 2px rgba(13,11,43,.06),0 6px 20px rgba(13,11,43,.05)}

*{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* modes: boot splash, sign in, app */
#boot,#auth,#app{display:none}
body[data-mode=boot] #boot{display:grid}body[data-mode=auth] #auth{display:grid}body[data-mode=app] #app{display:grid}
#boot{height:100%;place-items:center;background:var(--side);color:#fff}
#boot b{font-size:18px;font-weight:600;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#auth{min-height:100%;place-items:center;padding:20px}
#lf{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:var(--sh)}
#lf h1{font-size:20px;margin:0 0 4px}#lf p{margin:0 0 14px;color:var(--mut)}
#lf .btn{width:100%;margin-top:16px;padding:10px}
.err{color:#C0362C;font-size:13px;min-height:18px;margin:10px 0 0}
/* shell */
#app{height:100%;grid-template-columns:216px 1fr}
#side{background:var(--side);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
#side .logo{font-weight:600;font-size:16px;padding:2px 10px 18px}
#side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#B9B8D6;text-decoration:none;transition:background .15s,color .15s}
#side a:hover{background:rgba(255,255,255,.08)}
#side a.on{background:#fff;color:#0D0B2B;font-weight:600}
#side .gap{flex:1}#side small{color:#8F8EB5;padding:0 10px;overflow:hidden;text-overflow:ellipsis}
#col{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tact{display:flex;gap:8px;align-items:center}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--bg)}
#view{flex:1;min-height:0;overflow:auto;position:relative}
#view.fill{overflow:hidden}
#view.in>*{animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#tabs{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;transition:background .15s,opacity .15s}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}.btn.pri:hover{opacity:.9}
.btn[disabled]{opacity:.5;cursor:default}.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}.btn.del{color:#C0362C}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.seg button,.chip{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on,.chip.on{background:var(--on-bg);color:var(--on-fg)}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--card)}.chip.on{border-color:var(--on-bg)}
input[type=text],input[type=date],input[type=email],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);resize:vertical}
input[type=range]{width:100%;accent-color:var(--on-bg)}input[type=file]{font-size:12px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px}
label>input,label>textarea,label>select{display:block;margin-top:3px}
label.ck{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)}label.ck input{width:auto;margin:0}
/* create view */
.cview{display:flex;flex-direction:column;height:100%}
.bar2{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
.bar2 input{width:170px;flex:none}.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.work{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px}
#stage{background:var(--stage);display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;overflow:hidden;flex-direction:column;gap:8px}
#p{box-shadow:0 14px 44px rgba(13,11,43,.28);flex:none;border-radius:2px}
#dims{font-size:12px;color:var(--mut)}
.panel{background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:4px 16px 16px}
.panel details{border-bottom:1px solid var(--line);padding:2px 0}
.panel summary{cursor:pointer;font-weight:600;font-size:13px;padding:11px 0;list-style:none;display:flex;justify-content:space-between}
.panel summary::-webkit-details-marker{display:none}.panel summary::after{content:"+";color:var(--mut)}.panel details[open] summary::after{content:"\2212"}
.panel details>div,.panel details>label{margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lay button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px;cursor:pointer;text-align:left;font-size:11px;color:var(--ink)}
.lay button.on{border-color:var(--on-bg);box-shadow:0 0 0 2px var(--on-bg)}
.lay svg{display:block;width:100%;height:36px;margin-bottom:3px}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.sw input[type=color]{width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.gonly{display:none}.panel[data-bgm=grad] .gonly{display:block}.panel[data-bgm=grad] .sonly{display:none}
.imgs{display:flex;gap:8px;align-items:center}.imgs button{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background-size:cover;cursor:pointer}
.imgs button.on{border-color:var(--on-bg);box-shadow:0 0 0 2px var(--on-bg)}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.shows{display:flex;gap:6px 14px;flex-wrap:wrap}
.pfoot{display:grid;gap:8px;padding-top:14px}
/* pages */
.page{padding:20px 24px 28px;max-width:1100px;margin:0 auto}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card b{display:block;font-size:28px;font-weight:600;line-height:1.1}.card span{color:var(--mut);font-size:13px}
.card.q{display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.sec h2{font-size:16px;margin:0}.sec a{color:var(--mut);font-size:13px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .mini{background:var(--stage);padding:12px;display:flex;justify-content:center;cursor:pointer}
.tcard .bd{padding:12px}.tcard .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tcard h2{font-size:14px;margin:0}.tcard p{margin:2px 0 0;color:var(--mut);font-size:12px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut);margin-left:6px;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0D0B2B;color:#fff;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
@media(max-width:820px){
#app{grid-template-columns:1fr}#side{display:none}
#view{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);text-decoration:none;padding:4px 0}
#tabs a.on{color:var(--on-bg);font-weight:600}
#view.fill{overflow:auto}.cview{height:auto}
.bar2{flex-wrap:wrap}.bar2 input{width:100%}
.work{display:block}#stage{position:sticky;top:0;height:52vh;z-index:5}.panel{border-left:0;border-top:1px solid var(--line)}
.page{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.poster{--u0:1;--lf:1;--u:calc(var(--u0) * var(--lf));--s:1;--sp:1;--ip:55;--bl:0;--dim:0;--hf:'Fraunces',Georgia,serif;--hw:600;--hk:1;--bff:'Inter',Arial,sans-serif;--mff:'JetBrains Mono',monospace;--pbg:#0D0B2B;--pb:#0D0B2B;--pf:#fff;--ac:#38B6FF;--lt:#0D0B2B;container-type:inline-size;position:relative;overflow:hidden;background:var(--pbg);color:var(--pf);display:flex;flex-direction:column;font-family:var(--bff)}

      return '<label>' + d[0] + (d[1] === 'area' ? '<textarea rows="3" data-f="' + k + '"></textarea>' : '<input type="' + d[1] + '" data-f="' + k + '">') + '</label>';
    }).join('');
    $('shows').innerHTML = t.fields.filter(function (k) { return FIELDS[k][2]; }).map(function (k) { var s = FIELDS[k][2]; return '<label class="ck"><input type="checkbox" data-t="' + s + '">' + SHOWN[s] + '</label>'; }).join('');
    root.querySelectorAll('#fields [data-f]').forEach(function (i) { i.addEventListener('input', function () { st[i.dataset.f] = i.value; st.dirty = 1; render(); }); });
    root.querySelectorAll('#shows [data-t]').forEach(function (c) { c.addEventListener('change', function () { st.show[c.dataset.t] = c.checked ? 1 : 0; render(); }); });
  }
  function sync() {
    root.querySelectorAll('[data-f]').forEach(function (i) { i.value = st[i.dataset.f] || ''; });
    root.querySelectorAll('[data-t]').forEach(function (c) { c.checked = !!st.show[c.dataset.t]; });
    root.querySelectorAll('[data-r]').forEach(function (r) { r.value = st[r.dataset.r]; });
    root.querySelectorAll('[data-c]').forEach(function (c) { c.value = st[c.dataset.c]; });
    root.querySelectorAll('[data-font]').forEach(function (x) { x.value = st[x.dataset.font]; }); $('nm').value = st.name || '';
  }
  function on(sel, f) { root.querySelectorAll(sel).forEach(function (b) { b.classList.toggle('on', f(b)); }); }
  function render() {
    Poster.draw($('p'), st); Poster.fit($('stage'), $('p'), st.ar);
    $('panel').dataset.bgm = st.bgm;
    on('[data-tpl]', function (b) { return b.dataset.tpl === st.tpl; });
    on('[data-k]', function (b) { return String(st[b.dataset.k]) === b.dataset.v; });
    on('[data-cv]', function (b) { var a = b.dataset.cv.split('|'); return String(st[a[0]]).toLowerCase() === a[1].toLowerCase(); });
    on('[data-g]', function (b) { var g = BG_GRAD[+b.dataset.g]; return st.bgm === 'grad' && st.bgc === g[0] && st.bg2 === g[1]; });
    on('[data-scene]', function (b) { return !st.img && +b.dataset.scene === st.scene; });
    var r = Poster.R[st.ar]; $('dims').textContent = Poster.NAMES[st.ar] + ', ' + r[0] + ' x ' + r[1] + ' px, ' + st.fmt;
  }
  // Changing template keeps typed content; untouched sample text is swapped for the new sample
  function applyTpl(t, full) {
    var keep = { ar: st.ar, fmt: st.fmt, id: st.id, name: st.name, img: st.img, imgId: st.imgId, dirty: st.dirty, handle: st.handle };
    var base = stateFor(t, false);
    if (full || !st.dirty) { base = stateFor(t, true); if (full) { keep.img = null; keep.imgId = null; keep.dirty = 0; } }
    else CONTENT_KEYS.forEach(function (k) { if (k !== 'label' && k !== 'handle') base[k] = st[k]; });
    st = Object.assign(base, keep); fields(); sync(); tplChips(); render();
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
    if (d.tpl) applyTpl(TPLS[d.tpl], false);
    else if (d.k) { st[d.k] = d.k === 'flip' ? Number(d.v) : d.v; render(); }
    else if (d.cv) { var a = d.cv.split('|'); st[a[0]] = a[1]; if (a[0] === 'bgc') st.bgm = 'solid'; sync(); render(); }
    else if (d.g) { var g = BG_GRAD[+d.g]; st.bgm = 'grad'; st.bgc = g[0]; st.bg2 = g[1]; st.bga = g[2]; sync(); render(); }
    else if (d.scene) { st.scene = +d.scene; st.img = null; st.imgId = null; render(); }
  });
  root.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.r) { st[t.dataset.r] = +t.value; render(); }
    else if (t.dataset.c) { st[t.dataset.c] = t.value; if (t.dataset.c === 'bgc' && st.bgm !== 'grad') st.bgm = 'solid'; render(); }
    else if (t.dataset.font) { st[t.dataset.font] = t.value; render(); }
    else if (t.id === 'nm') st.name = t.value;
    else if (t.dataset.f === 'handle') { st.handle = t.value; render(); }
  });
  root.addEventListener('change', function (e) { var t = e.target; if (t.dataset.t === 'icons' || t.dataset.t === 'source') { st.show[t.dataset.t] = t.checked ? 1 : 0; render(); } });
  $('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    st.img = URL.createObjectURL(f); st.imgId = null; uploading = true; $('upl').textContent = 'Uploading to Cloudinary...'; render();
    D.upload(f).then(function (m) { st.img = m.url; st.imgId = m.publicId; uploading = false; $('upl').textContent = 'Uploaded (' + m.width + ' x ' + m.height + ' px).'; render(); })
      .catch(function (er) { uploading = false; $('upl').textContent = 'Upload failed: ' + er.message + '. Preview only; saving needs an uploaded image.'; });
  });
  $('fall').onclick = function () { st.bf = st.hf; st.mf = st.hf; sync(); render(); };
  $('rst').onclick = function () { applyTpl(TPLS[st.tpl], true); S.toast('Reset to template defaults'); };
  gid('save').onclick = function () {
    if (uploading || (st.img && st.img.indexOf('blob:') === 0)) { S.toast('Wait for the image upload to finish.'); return; }
    st.name = $('nm').value || st.title;
    D.saveDesign(st.id, D.pack(st)).then(function (rid) { st.id = rid; history.replaceState(null, '', '/studio/create/?id=' + rid); S.toast('Design saved'); }).catch(function (er) { S.toast('Could not save: ' + er.message); });
  };
  gid('exp').onclick = function () {
    if (uploading) { S.toast('Wait for the image upload to finish.'); return; }
    var btn = gid('exp'); btn.disabled = true; btn.textContent = 'Preparing...';
    Poster.exportImage(st, st.fmt).then(function (u) { Poster.download(u, st, st.fmt); S.toast('Downloaded'); }).catch(function (er) { S.toast('Export failed: ' + er.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Export'; });
  };
  // Template saving is admin only (the Firestore rules enforce it too)
  function tplData() { var t = TPLS[st.tpl]; return { config: clone(CONFIG_KEYS.reduce(function (o, k) { o[k] = st[k]; return o; }, {})), meta: st.meta, label: st.label, name: t.name, kind: t.kind || t.id, fields: t.fields, sample: t.sample, enabled: true }; }
  $('tupd').onclick = function () {
    var d = tplData(); delete d.sample; delete d.fields;
    D.saveTemplate(st.tpl, d).then(function () { Object.assign(TPLS[st.tpl], { config: d.config, meta: d.meta, label: d.label }); S.toast('Template updated'); }, function () { S.toast('Only admins can change templates.'); });
  };
  $('tnew').onclick = function () {
    var n = prompt('Name for the new template variation'); if (!n) return;
    var d = tplData(); d.name = n;
    D.addTemplate(d).then(function (nid) { d.id = nid; TPLS[nid] = d; st.tpl = nid; tplChips(); render(); S.toast('Template saved'); }, function () { S.toast('Only admins can change templates.'); });
  };
  return function () { dead = true; if (ro) ro.disconnect(); gid('tact').innerHTML = ''; };
} };

</script>
</body></html>
